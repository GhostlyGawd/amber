name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, vet, test, gated suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./internal ./cmd ./eval)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: unit tests
        run: go test ./internal/... -count=1

      # The §13/§14 acceptance gates. A red suite blocks merge — this is
      # what "poisoning suite green in CI" and "recall CI-gated" mean.
      - name: acceptance suites (poisoning, contradiction, recall)
        run: go test ./internal/suites/ -run 'TestPoisoningSuite|TestContradictionSuite|TestRecallSuite|TestWeek1Acceptance' -v -count=1

  size:
    name: binary size budget (<25MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: build release binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o amber ./cmd/amber
      - name: check size
        run: |
          bytes=$(stat -c%s amber)
          mb=$(( bytes / 1024 / 1024 ))
          echo "binary: ${mb}MB (${bytes} bytes)"
          if [ "$bytes" -gt 26214400 ]; then
            echo "binary exceeds 25MB budget"; exit 1
          fi

  cross-compile:
    name: cross-compile tier-1 targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o /dev/null ./cmd/amber
